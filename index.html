<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Najed Zouari — Portfolio</title>
<meta name="description" content="Esperto in Social Media Management, Design & Video Production. Trasformo le tue idee in contenuti che conquistano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --background:41 46% 87%;--foreground:214 32% 17%;--card:41 62% 92%;
  --primary:42 95% 32%;--primary-foreground:41 62% 96%;
  --secondary:42 38% 81%;--muted-foreground:38 18% 34%;--border:40 30% 76%;
  --blue-deep:41 40% 83%;
  --gradient-hero:radial-gradient(ellipse at top,hsl(42 60% 92%) 0%,hsl(41 46% 86%) 100%);
  --gradient-spotlight:radial-gradient(circle at 50% 0%,hsl(44 100% 48% / .14) 0%,transparent 50%);
  --gradient-card:linear-gradient(135deg,hsl(41 62% 93%) 0%,hsl(41 45% 89%) 100%);
  --shadow-glow:0 0 50px hsl(44 100% 48% / .25);
}
html:not(.dark) .gold{background:linear-gradient(90deg,#B07D05,#9C6E04,#8A5F02);-webkit-background-clip:text;background-clip:text;color:transparent}
.dark{
  --background:222 47% 11%;--foreground:0 0% 98%;--card:222 47% 14%;
  --primary:43 96% 56%;--primary-foreground:222 47% 11%;
  --secondary:222 47% 20%;--muted-foreground:215 20% 65%;--border:222 30% 25%;
  --blue-deep:222 47% 8%;
  --gradient-hero:radial-gradient(ellipse at top,hsl(222 47% 20%) 0%,hsl(222 47% 8%) 100%);
  --gradient-spotlight:radial-gradient(circle at 50% 0%,hsl(43 96% 56% / .15) 0%,transparent 50%);
  --gradient-card:linear-gradient(135deg,hsl(222 47% 18%) 0%,hsl(222 47% 12%) 100%);
  --shadow-glow:0 0 60px hsl(43 96% 56% / .2);
}
*{box-sizing:border-box;border-color:hsl(var(--border))}
html{scroll-behavior:smooth}
body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;font-weight:400;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.container{max-width:1400px;margin:0 auto;padding:0 1rem}
.gold{background:linear-gradient(90deg,#fbbf24,#facc15,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:hsl(var(--muted-foreground))}
.icon{width:1.25rem;height:1.25rem;display:inline-block}
section{position:relative;overflow:hidden}
.sec{padding:6rem 0}
.deep{background:hsl(var(--blue-deep))}
.head{text-align:center;margin-bottom:4rem}
.head h2{font-size:clamp(3rem,7vw,4.5rem);margin-bottom:1rem}
.head p{font-size:1.125rem;max-width:36rem;margin:0 auto}
.orb{position:absolute;border-radius:50%;filter:blur(64px);pointer-events:none}
.card{background:var(--gradient-card);border:1px solid hsl(var(--border) / .5);border-radius:1rem;transition:transform .4s,border-color .5s}
.card:hover{border-color:hsl(var(--primary) / .5);transform:translateY(-8px) scale(1.02)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.5rem;font-weight:600;transition:all .3s;white-space:nowrap}
.btn-hero{background:linear-gradient(90deg,#fbbf24,#facc15,#f59e0b);color:hsl(222 47% 8%);font-weight:700}
.btn-hero:hover{box-shadow:var(--shadow-glow);transform:scale(1.05)}
.btn-outline{border:2px solid hsl(var(--primary) / .5);color:hsl(var(--foreground))}
.btn-outline:hover{border-color:hsl(var(--primary));background:hsl(var(--primary) / .1)}
.xl{height:3.5rem;padding:0 2.5rem;font-size:1.125rem}
.sm{height:2.25rem;padding:0 .9rem;font-size:.875rem}
.pill{border-radius:999px;background:hsl(var(--secondary))}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .7s ease-out,transform .7s ease-out}
.reveal.in{opacity:1;transform:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes spinr{to{transform:translate(-50%,-50%) rotate(-360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.1)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes twinkle{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-30px);opacity:.8}}
@keyframes pop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;transition:all .3s}
nav.scrolled{background:hsl(var(--background) / .9);backdrop-filter:blur(16px);border-bottom:1px solid hsl(var(--border) / .5);box-shadow:0 10px 15px -3px rgba(0,0,0,.2)}
.navin{display:flex;align-items:center;justify-content:space-between;height:5rem}
.nz{display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;border-radius:.75rem;background:linear-gradient(135deg,#fbbf24,#facc15,#f59e0b);color:hsl(222 47% 11%);font-family:'Bebas Neue';font-size:1.6rem;letter-spacing:.06em;padding-top:.15rem;box-shadow:var(--shadow-glow);transition:transform .3s}
.nz:hover{transform:scale(1.08) rotate(-4deg)}
.logo{font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:.1em}
.links{display:flex;align-items:center;gap:1.5rem}
.links .nl{position:relative;font-size:.875rem;font-weight:500;color:hsl(var(--muted-foreground));padding:.75rem 0}
.links .nl:hover{color:hsl(var(--foreground))}
.links .nl.active{color:hsl(var(--primary))}
.links .nl.active::after{content:"";position:absolute;left:0;right:0;bottom:.4rem;height:2px;background:hsl(var(--primary))}
.ctrls{display:flex;align-items:center;gap:.75rem;margin-left:1rem}
.round{width:2.5rem;height:2.5rem;border-radius:999px;background:hsl(var(--secondary));display:flex;align-items:center;justify-content:center;color:hsl(var(--muted-foreground))}
.round:hover{color:hsl(var(--foreground))}
.lang{position:relative}
.langbtn{display:flex;align-items:center;gap:.4rem;padding:.5rem .75rem;border-radius:999px;background:hsl(var(--secondary));color:hsl(var(--muted-foreground));font-size:.875rem;font-weight:500;min-height:2.5rem}
.langmenu{position:absolute;top:100%;right:0;margin-top:.5rem;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:.75rem;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.3);display:none;z-index:60;min-width:7rem}
.langmenu.open{display:block}
.langmenu button{display:flex;align-items:center;gap:.75rem;width:100%;padding:.75rem 1rem;text-align:left;font-weight:500}
.langmenu button:hover{background:hsl(var(--secondary))}
.langmenu button.on{background:hsl(var(--primary) / .1);color:hsl(var(--primary))}
.mob{display:none;align-items:center;gap:.5rem}
.mobmenu{display:none;background:hsl(var(--background) / .95);backdrop-filter:blur(16px);border-bottom:1px solid hsl(var(--border))}
.mobmenu.open{display:block}
.mobmenu .container{padding-top:1rem;padding-bottom:1rem;display:flex;flex-direction:column;gap:.5rem}
.mobmenu .nl{text-align:left;padding:.6rem 0;font-weight:500}
@media (max-width:767px){.links{display:none}.mob{display:flex}.navin{height:4rem}}

/* hero */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--gradient-hero)}
.spot{position:absolute;inset:0;background:var(--gradient-spotlight);animation:pulse 4s infinite;pointer-events:none}
.ring{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid hsl(var(--primary) / .1);transform:translate(-50%,-50%)}
.hero .inner{position:relative;z-index:1;text-align:center;padding:0 1rem}
.badge{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:999px;background:hsl(var(--secondary) / .5);border:1px solid hsl(var(--border));font-size:.875rem;color:hsl(var(--muted-foreground));margin-bottom:2rem}
.hero h1{font-size:clamp(4.5rem,15vw,12rem);line-height:1;margin-bottom:.5rem}
.hero .tagline{font-size:clamp(1.05rem,2vw,1.35rem);font-weight:500;color:hsl(var(--foreground));max-width:46rem;margin:0 auto 2.5rem!important;letter-spacing:.01em}
.hero .highlight-line{margin:0 auto 3rem!important}
.hero p{font-size:clamp(1.25rem,2.5vw,1.5rem);max-width:42rem;margin:0 auto 3rem}
.hero p strong{color:hsl(var(--foreground));font-weight:500}
.ctas{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.scroll{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5rem;color:hsl(var(--muted-foreground));font-size:.875rem;text-transform:uppercase;letter-spacing:.2em;z-index:1}
.scroll:hover{color:hsl(var(--primary))}
.scroll i,.scroll svg{animation:bob 1.5s infinite}

/* grids */
.grid{display:grid;gap:1.5rem;margin:0 auto}
.g-services{max-width:80rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.svc{padding:2rem;position:relative}
.svc .ic{width:3.5rem;height:3.5rem;border-radius:.75rem;background:hsl(var(--secondary));display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem;color:hsl(var(--primary));transition:all .3s}
.svc:hover .ic{background:hsl(var(--primary) / .2);transform:rotate(10deg)}
.svc .ic svg{width:1.75rem;height:1.75rem}
.svc h3{font-size:1.25rem;margin-bottom:.75rem}
.svc p{font-size:.875rem;line-height:1.6;margin:0}
.topline{position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,hsl(var(--primary)),transparent);animation:pulse 3s infinite}
.gridbg{position:absolute;inset:0;opacity:.1;background-image:linear-gradient(hsl(var(--primary) / .1) 1px,transparent 1px),linear-gradient(90deg,hsl(var(--primary) / .1) 1px,transparent 1px);background-size:60px 60px}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:.75rem;margin-bottom:3rem}
.filters button{padding:.5rem 1.5rem;border-radius:999px;font-weight:500;background:hsl(var(--secondary) / .5);color:hsl(var(--muted-foreground));transition:all .3s;min-height:2.75rem}
.filters button:hover{background:hsl(var(--secondary));color:hsl(var(--foreground))}
.filters button.on{background:hsl(var(--primary));color:hsl(var(--primary-foreground));box-shadow:var(--shadow-glow)}
.g-projects{max-width:64rem;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:2rem}
.proj{position:relative;border-radius:1rem;overflow:hidden;aspect-ratio:4/3;cursor:pointer}
.proj .img{position:absolute;inset:0;transition:transform .6s;background-size:cover;background-position:center}
.proj:hover .img{transform:scale(1.1)}
.proj .ov{position:absolute;inset:0;background:linear-gradient(to top,hsl(var(--background)),hsl(var(--background) / .8),transparent);opacity:.7;transition:opacity .3s}
.proj:hover .ov{opacity:1}
.proj .ct{position:absolute;left:0;right:0;bottom:0;padding:1.5rem}
#vid-intro{margin:0 0 1.5rem}
.vi-line{text-align:center;color:hsl(var(--muted-foreground));margin:.25rem auto 0;max-width:40rem}
.vi-line b{color:hsl(var(--primary))}
.vi-stage{position:relative;height:96px;overflow:hidden;pointer-events:none}
.vi-path{position:absolute;left:0;right:0;top:34px;border-top:2px dashed hsl(var(--primary)/.35);transform-origin:left;transform:scaleX(0)}
.vi-drone{position:absolute;top:8px;left:-90px;width:72px;color:hsl(var(--primary));filter:drop-shadow(0 4px 10px hsl(var(--primary)/.35))}
.vi-drone .pr{transform-box:fill-box;transform-origin:center;animation:vi-spin .12s linear infinite}
.vi-cam{position:absolute;left:50%;top:52px;transform:translateX(-50%) scale(0);color:hsl(var(--primary));width:34px;height:34px}
.vi-flash{position:absolute;left:50%;top:69px;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(#fff,rgba(255,255,255,.6) 30%,transparent 70%);opacity:0}
.proj.reel .more p{display:none}
.proj.reel .more{opacity:1;transform:none}
.proj .play{position:absolute;top:27%;left:50%;transform:translate(-50%,-50%);z-index:1;width:4rem;height:4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:hsl(var(--background)/.35);border:2px solid #fff;color:#fff;backdrop-filter:blur(4px);transition:transform .3s,background .3s}
.proj .play svg{width:1.6rem;height:1.6rem;margin-left:3px;fill:#fff}
.proj:hover .play{transform:translate(-50%,-50%) scale(1.12);background:hsl(var(--primary));border-color:hsl(var(--primary))}
.vi-stage.go .vi-path{animation:vi-path 1.6s ease-out forwards}
.vi-stage.go .vi-drone{animation:vi-fly 2.6s cubic-bezier(.45,.05,.35,1) forwards,vi-bob .6s ease-in-out infinite}
.vi-stage.go .vi-cam{animation:vi-cam .5s .9s cubic-bezier(.3,1.6,.5,1) forwards}
.vi-stage.go .vi-flash{animation:vi-flash .35s 1.25s ease-out}
.vi-stage.done .vi-path{transform:scaleX(1)}.vi-stage.done .vi-drone{left:calc(100% - 80px);animation:vi-bob 1.4s ease-in-out infinite}.vi-stage.done .vi-cam{transform:translateX(-50%) scale(1)}
@keyframes vi-spin{to{transform:rotate(360deg)}}
@keyframes vi-bob{50%{margin-top:5px}}
@keyframes vi-path{to{transform:scaleX(1)}}
@keyframes vi-fly{0%{left:-90px}45%{left:calc(50% - 36px)}60%{left:calc(50% - 36px)}100%{left:calc(100% - 80px)}}
@keyframes vi-cam{to{transform:translateX(-50%) scale(1)}}
@keyframes vi-flash{0%{opacity:.75}100%{opacity:0}}
.vids-in .proj{opacity:0;animation:vi-card .6s ease-out forwards}
@keyframes vi-card{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.roles{display:flex;flex-wrap:wrap;gap:.3rem;margin:-.25rem 0 .6rem}
.roles span{display:inline-flex;align-items:center;gap:.25rem;font-size:.68rem;font-weight:600;padding:.15rem .45rem;border-radius:999px;background:hsl(var(--background)/.75);border:1px solid hsl(var(--primary)/.5);color:#fff;backdrop-filter:blur(4px)}
.roles svg{width:.85rem;height:.85rem;color:hsl(var(--primary))}
@media (prefers-reduced-motion:reduce){.vi-stage{display:none}.vids-in .proj{opacity:1;animation:none}}
.tag{display:inline-block;padding:.25rem .75rem;border-radius:999px;background:hsl(var(--primary) / .2);color:hsl(var(--primary));font-size:.875rem;font-weight:500;margin-bottom:.75rem}
.proj h3{font-size:clamp(1.5rem,3vw,1.875rem);margin-bottom:.5rem}
.proj .more{opacity:0;transform:translateY(10px);transition:all .3s}
.proj:hover .more{opacity:1;transform:none}
.proj .more p{margin:0 0 .75rem}
.proj .more div{display:flex;justify-content:space-between;align-items:center;color:hsl(var(--primary));font-weight:700}
.proj .dom{position:absolute;top:38%;left:0;right:0;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:.6rem;font-family:'Bebas Neue';font-size:clamp(1.75rem,4vw,2.5rem);letter-spacing:.06em;color:#fff;z-index:1;opacity:.9}
.proj .bd{position:absolute;inset:0;border:2px solid hsl(var(--primary));border-radius:1rem;opacity:0;transition:opacity .3s;pointer-events:none}
.proj:hover .bd{opacity:1}
.g-acc{max-width:72rem;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.acc{padding:1.5rem}
.acc .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem}
.acc .av{width:3rem;height:3rem;border-radius:.75rem;display:flex;align-items:center;justify-content:center;color:#fff}
.acc .avi{width:3.5rem;height:3.5rem;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 2px hsl(var(--primary)),0 0 0 4px hsl(var(--background))}
.acc .cat{padding:.25rem .75rem;border-radius:999px;background:hsl(var(--secondary));color:hsl(var(--muted-foreground));font-size:.75rem;font-weight:500}
.acc h3{font-size:1.25rem;margin-bottom:.75rem}
.acc .pl{display:flex;gap:.5rem;margin-bottom:1rem}
.acc .pl a{width:2.75rem;height:2.75rem;border-radius:999px;background:hsl(var(--secondary));display:flex;align-items:center;justify-content:center;color:hsl(var(--muted-foreground));transition:all .3s}
.acc .pl a:hover{color:hsl(var(--primary));background:hsl(var(--primary) / .1)}
.acc .pl svg{width:1rem;height:1rem}
.acc .st{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.acc .st>div{text-align:center;padding:.75rem;border-radius:.75rem;background:hsl(var(--secondary) / .5)}
.acc .st svg{width:1rem;height:1rem}
.acc .st b{display:block;font-size:1.25rem}
.acc .st small{font-size:.75rem;color:hsl(var(--muted-foreground))}
.green{color:#22c55e}
.dots{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(circle at 2px 2px,currentColor 1px,transparent 1px);background-size:40px 40px}
.g-ind{max-width:72rem;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.ind{padding:2rem;text-align:center;height:100%}
.ind .ic{width:4rem;height:4rem;margin:0 auto 1.5rem;border-radius:1rem;display:flex;align-items:center;justify-content:center;color:#fff}
.ind .ic svg{width:2rem;height:2rem}
.ind h3{font-size:1.25rem;color:hsl(var(--primary));margin-bottom:1rem}
.ind ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem;font-size:.875rem}
.stats{padding:5rem 0 6rem;border-top:1px solid hsl(var(--primary) / .25);border-bottom:1px solid hsl(var(--primary) / .25)}
.stats .stat{background:var(--gradient-card);border:1px solid hsl(var(--primary) / .35);border-radius:1.25rem;padding:2.25rem 1.5rem;box-shadow:var(--shadow-glow);transition:transform .4s}
.stats .stat:hover{transform:translateY(-6px)}
.g-stats{max-width:68rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2rem}
.stat{text-align:center}
.stat .ic{width:4rem;height:4rem;margin:0 auto 1.5rem;border-radius:1rem;background:hsl(var(--secondary) / .5);display:flex;align-items:center;justify-content:center;color:hsl(var(--primary))}
.stat .ic svg{width:2rem;height:2rem}
.num{font-family:'Bebas Neue';font-size:clamp(4.5rem,10vw,8rem);line-height:1;display:block;margin-bottom:1rem}
.stars{display:flex;justify-content:center;gap:.5rem;margin-bottom:1rem;color:hsl(var(--primary))}
.stars svg{width:2rem;height:2rem;fill:currentColor;transform:scale(0)}
.in .stars svg{animation:pop .6s forwards}
.flags{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem;font-size:2.25rem}
.flags span{transition:transform .3s;display:inline-flex}
.stats .feat{grid-column:1/-1;padding:2.5rem 1.5rem 2rem}
.featnums{display:flex;align-items:center;justify-content:center;gap:clamp(1rem,4vw,3rem);flex-wrap:wrap}
.featnums p{margin:.25rem 0 0!important}
.from{font-family:'Bebas Neue';font-size:clamp(1.75rem,4vw,2.75rem);letter-spacing:.1em;color:hsl(var(--muted-foreground))}
.feat .flags{margin:0;gap:.6rem;max-width:22rem;justify-content:center}
.feat .flags span{display:inline-flex}
.feat .flags svg{width:36px;height:24px}
.g-stats{max-width:60rem;grid-template-columns:1fr;gap:1.5rem}

.flags svg{border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.multi{font-family:'Bebas Neue';font-size:1.75rem;letter-spacing:.08em;color:hsl(var(--primary));margin:0 0 .75rem!important;text-transform:none!important}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem}
.langs span{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .9rem;border-radius:999px;background:hsl(var(--secondary));border:1px solid hsl(var(--primary) / .3);font-size:.95rem;font-weight:500}
.flags span:hover{transform:scale(1.3) translateY(-5px)}
.stat p{font-size:1.25rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin:1rem 0 0}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:hsl(var(--primary) / .3);animation:twinkle 4s infinite}
.contact .inner{max-width:48rem;margin:0 auto;text-align:center}
.contact h2{font-size:clamp(3rem,7vw,4.5rem);margin-bottom:1.5rem}
.contact .lead{font-size:1.25rem;margin:0 0 3rem}
.socials{display:flex;justify-content:center;gap:1rem;margin-top:4rem}
.socials a{width:3.5rem;height:3.5rem;border-radius:999px;background:hsl(var(--secondary));display:flex;align-items:center;justify-content:center;color:hsl(var(--muted-foreground));transition:all .3s}
.socials a:hover{color:hsl(var(--primary));background:hsl(var(--primary) / .1);transform:translateY(-5px) scale(1.15)}
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,10,25,.92);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:4.5rem 1rem 1.5rem;gap:1rem}
.lb.open{display:flex}

.nz-anim:hover .r,.nz-anim:focus-visible .r,.nz-anim.play .r{max-width:6ch;opacity:1}
.nz-anim:hover .gap,.nz-anim:focus-visible .gap,.nz-anim.play .gap{width:.45em}

.hero-stats{max-width:64rem!important}

.lbpr{position:absolute;left:50%;bottom:.9rem;transform:translateX(-50%);display:flex;align-items:center;gap:.45rem;max-width:calc(100vw - 2rem);overflow-x:auto;padding:.45rem .6rem;border-radius:999px;background:hsl(var(--card)/.85);border:1px solid hsl(var(--primary)/.35);white-space:nowrap;scrollbar-width:none}

.training{background:linear-gradient(180deg,transparent,hsl(var(--secondary)/.25),transparent)}

.tr-stats{display:grid;grid-template-columns:repeat(2,1fr);max-width:54rem;margin:0 auto 3rem;border:1px solid hsl(var(--primary)/.3);border-radius:1rem;background:hsl(var(--card)/.55);overflow:hidden}

.tr-h{text-align:center;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:hsl(var(--muted-foreground));margin:0 0 1.25rem;font-weight:600}

.tr-formats svg{width:1.1rem;height:1.1rem;color:hsl(var(--primary))}
@media (max-width:640px){.tr-stats{grid-template-columns:1fr}.tr-stats>div+div{border-left:0;border-top:1px solid hsl(var(--primary)/.2)}}

.tr-gal{max-width:72rem;margin-left:auto;margin-right:auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:.75rem;overflow-x:auto;margin-top:2.5rem;padding-bottom:.5rem;scrollbar-width:thin}

  document.querySelectorAll(".num").forEach(n=>{const to=+n.dataset.to,suf=n.dataset.suf;let c=0,st=to/60;const tm=setInterval(()=>{c+=st;if(c>=to){n.textContent=to+suf;clearInterval(tm)}else n.textContent=Math.floor(c)+suf},2000/60)});
}),{rootMargin:"-100px"});
so.observe(document.getElementById("stats-grid"));
/* particles */
const _pt=document.getElementById("particles");if(_pt)_pt.innerHTML=Array.from({length:20},()=>`<div class="particle" style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${3+Math.random()*2}s;animation-delay:${Math.random()*2}s"></div>`).join("");
/* nav */
const nav=document.getElementById("nav"),secs=["s-services","s-projects","s-experience","s-contact"];
addEventListener("scroll",()=>{nav.classList.toggle("scrolled",scrollY>50);let act="";for(const s of [...secs].reverse()){const el=document.getElementById(s);if(el&&scrollY>=el.offsetTop-200){act=s;break}}document.querySelectorAll(".links .nl").forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+act))},{passive:true});
{const fab=document.getElementById("fab"),ct=document.getElementById("s-contact");const fu=()=>{const r=ct.getBoundingClientRect();fab.classList.toggle("show",scrollY>600&&r.top>innerHeight*.6)};addEventListener("scroll",fu,{passive:true});fu()}
const burger=document.getElementById("burger"),mm=document.getElementById("mobmenu");
burger.onclick=()=>{const o=mm.classList.toggle("open");burger.setAttribute("aria-expanded",o);burger.innerHTML=`<i data-lucide="${o?"x":"menu"}"></i>`;icons()};
mm.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{mm.classList.remove("open");burger.innerHTML='<i data-lucide="menu"></i>';icons()}));
document.addEventListener("click",()=>document.querySelectorAll(".langmenu").forEach(m=>m.classList.remove("open")));
/* services → accounts / filtered projects */
function goService(k){if(k==="training"){document.getElementById("s-training").scrollIntoView({behavior:"smooth"});return}const c=SVC_TARGET[k];if(!c){document.getElementById("s-accounts").scrollIntoView({behavior:"smooth"});return}
 if(PROJECTS.some(p=>p.cat===c)&&cat!==c){cat=c;render()}document.getElementById("s-projects").scrollIntoView({behavior:"smooth"})}
/* lightbox */
const lb=document.getElementById("lb");let lbP=0,lbI=0;
function openLB(p,i){lbP=p;lbI=i;showLB();lb.classList.add("open");document.body.style.overflow="hidden";lb.querySelector(".lbx").focus()}
function showLB(){const p=PROJECTS[lbP],g=p.gallery;lbI=(lbI+g.length)%g.length;lb.querySelector("img").src=g[lbI];lb.querySelector("img").alt=p.title[lang]+" "+(lbI+1);lb.querySelector(".lbt").textContent=p.title[lang];lb.querySelector(".lbc").textContent=(p.caps?p.caps[lbI][lang]+"  ·  ":"")+(lbI+1)+" / "+g.length;const d=lb.querySelector(".lbd"),ln=p.links&&p.links[lbI];d.style.display=(p.drive||ln)?"":"none";d.href=ln||p.drive||"#";d.textContent=ln?({it:"Vedi su LinkedIn",fr:"Voir sur LinkedIn",en:"See on LinkedIn"})[lang]:(p.linkLabel||{it:"Vedi tutto su Drive",fr:"Tout voir sur Drive",en:"See all on Drive"})[lang];const pr=lb.querySelector(".lbpr");lb.classList.toggle("haspress",!!p.press);pr.innerHTML=p.press?`<span class="lbpt"><i data-lucide="newspaper"></i>${esc(PRESS.seen[lang])}</span>${PRESS.list.map(([c,n,u])=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${flag(c,16)}${esc(n)}</a>`).join("")}<span class="lbpm">${esc(PRESS.more[lang])}</span>`:"";if(p.press)icons()}
function closeLB(){lb.classList.remove("open");document.body.style.overflow=""}
lb.querySelector(".lbx").onclick=closeLB;lb.querySelector(".lbp").onclick=()=>{lbI--;showLB()};lb.querySelector(".lbn").onclick=()=>{lbI++;showLB()};
lb.onclick=e=>{if(e.target===lb)closeLB()};
lb.onkeydown=e=>{if(e.key==="Escape")closeLB();if(e.key==="ArrowLeft"){lbI--;showLB()}if(e.key==="ArrowRight"){lbI++;showLB()}};
document.addEventListener("click",e=>{if(!e.target.closest("[data-press]"))return;e.preventDefault();e.stopImmediatePropagation();if(cat!=="Photography"){cat="Photography";render()}const k=PROJECTS.findIndex(p=>p.press);document.getElementById("s-projects").scrollIntoView({behavior:"smooth"});setTimeout(()=>openLB(k,0),700)},true);
/* in-page links: scroll without changing the URL hash (so shared links always open at the top) */
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const id=a.getAttribute("href").slice(1);const t=id?document.getElementById(id):null;e.preventDefault();(t||document.body).scrollIntoView({behavior:"smooth"});if(!t)window.scrollTo({top:0,behavior:"smooth"});mm.classList.remove("open")});
if("scrollRestoration" in history)history.scrollRestoration="manual";
const toTop=()=>{try{window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0}catch(e){}};
toTop();addEventListener("DOMContentLoaded",toTop);addEventListener("load",()=>{toTop();setTimeout(toTop,50);setTimeout(toTop,400)});
addEventListener("hashchange",e=>{if(!document.getElementById(location.hash.slice(1)))toTop()});

window.scrollTo(0,0);
/* play the name reveal once on load (useful on touch screens) */
(()=>{const b=document.querySelector(".nz-anim");if(!b||matchMedia("(prefers-reduced-motion: reduce)").matches)return;setTimeout(()=>b.classList.add("play"),900);setTimeout(()=>b.classList.remove("play"),3200);b.addEventListener("touchstart",()=>{b.classList.add("play");setTimeout(()=>b.classList.remove("play"),2200)},{passive:true})})();
document.getElementById("yr").textContent=new Date().getFullYear();
document.querySelectorAll(".langs [data-f]").forEach(s=>s.insertAdjacentHTML("afterbegin",flag(s.dataset.f,20)));
render();
</script>
